name: Hello Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 打个招呼
        run: echo "Hello from GitHub Actions"

      - name: 打印环境信息
        run: |
          echo "当前目录: $(pwd)"
          echo "触发者: ${{ github.actor }}"
          echo "仓库: ${{ github.repository }}"
